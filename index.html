<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY TVET Dashboard</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ── */
    body {
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: #f7f8fa;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .dashboard-header {
      background: #1f2328;
      color: #fff;
      padding: 0 24px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-logo { font-size: 2.2rem; line-height: 1; }
    .header-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
      line-height: 1.2;
    }
    .header-subtitle { font-size: 0.8rem; color: #8b949e; margin: 0; }
    .header-date { font-size: 0.82rem; color: #8b949e; text-align: right; }

    /* ── Main ── */
    .dashboard-main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Cards row ── */
    .cards-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* ── Summary Card ── */
    .summary-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex: 1;
      min-width: 200px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-icon { font-size: 2rem; line-height: 1; margin-top: 2px; flex-shrink: 0; }
    .card-body { display: flex; flex-direction: column; gap: 2px; }
    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #57606a;
    }
    .card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #1f2328;
      line-height: 1.1;
      margin: 2px 0;
    }
    .card-sublabel { font-size: 0.82rem; color: #57606a; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .badge--upcoming  { background: #fef9c3; color: #854d0e; }
    .badge--active    { background: #dcfce7; color: #166534; }
    .badge--completed { background: #f3f4f6; color: #374151; }
    .badge--cancelled { background: #fee2e2; color: #991b1b; }

    /* ── Checklist Card ── */
    .checklist-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .checklist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .checklist-title { font-size: 1rem; font-weight: 700; color: #1f2328; }
    .checklist-progress {
      font-size: 0.82rem;
      color: #57606a;
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 2px 10px;
      white-space: nowrap;
    }

    /* ── Progress Bar ── */
    .progress-bar-track {
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #3b82d4;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* ── Checklist Items ── */
    .checklist-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .checklist-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .checklist-label:hover { background: #f7f8fa; }
    .checklist-checkbox {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      accent-color: #3b82d4;
      cursor: pointer;
    }
    .checklist-text { font-size: 0.92rem; color: #1f2328; line-height: 1.4; }
    .checklist-item.done .checklist-text {
      text-decoration: line-through;
      color: #57606a;
    }

    /* ── Footer ── */
    .dashboard-footer {
      text-align: center;
      font-size: 0.75rem;
      color: #57606a;
      border-top: 1px solid #e5e7eb;
      padding: 14px 24px;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-logo">🎓</span>
        <div>
          <h1 class="header-title">MY TVET Dashboard</h1>
          <p class="header-subtitle">Workshop Management Overview</p>
        </div>
      </div>
      <div class="header-date" id="today-date"></div>
    </div>
  </header>

  <!-- Main -->
  <main class="dashboard-main">

    <!-- Summary Cards -->
    <section class="cards-row">

      <!-- Students Registered -->
      <div class="summary-card">
        <div class="card-icon">👥</div>
        <div class="card-body">
          <p class="card-title">Students Registered</p>
          <p class="card-value">42</p>
          <p class="card-sublabel">38 confirmed · 4 pending</p>
        </div>
      </div>

      <!-- Tasks Remaining -->
      <div class="summary-card">
        <div class="card-icon">✅</div>
        <div class="card-body">
          <p class="card-title">Tasks Remaining</p>
          <p class="card-value">5</p>
          <p class="card-sublabel">Out of 12 total tasks</p>
        </div>
      </div>

      <!-- Workshop Status -->
      <div class="summary-card">
        <div class="card-icon">🏫</div>
        <div class="card-body">
          <p class="card-title">Workshop Status</p>
          <p class="card-value">
            <span class="badge badge--upcoming">Upcoming</span>
          </p>
          <p class="card-sublabel">📅 15 July 2025</p>
        </div>
      </div>

    </section>

    <!-- Preparation Checklist -->
    <section class="checklist-card">
      <div class="checklist-header">
        <h2 class="checklist-title">📝 Preparation Checklist</h2>
        <span class="checklist-progress" id="checklist-counter">3 of 7 completed</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar" style="width: 43%"></div>
      </div>
      <ul class="checklist-list" id="checklist">
        <li class="checklist-item done">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" checked />
            <span class="checklist-text">Venue confirmed and access arranged</span>
          </label>
        </li>
        <li class="checklist-item done">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" checked />
            <span class="checklist-text">Materials printed / slides uploaded</span>
          </label>
        </li>
        <li class="checklist-item done">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" checked />
            <span class="checklist-text">Registration list finalised</span>
          </label>
        </li>
        <li class="checklist-item">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" />
            <span class="checklist-text">Payment collection completed</span>
          </label>
        </li>
        <li class="checklist-item">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" />
            <span class="checklist-text">Attendance check-in system tested</span>
          </label>
        </li>
        <li class="checklist-item">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" />
            <span class="checklist-text">Participants notified of schedule</span>
          </label>
        </li>
        <li class="checklist-item">
          <label class="checklist-label">
            <input type="checkbox" class="checklist-checkbox" />
            <span class="checklist-text">Facilitators briefed on agenda</span>
          </label>
        </li>
      </ul>
    </section>

  </main>

  <!-- Footer -->
  <footer class="dashboard-footer">
    MY TVET Dashboard &mdash; Workshop Management System
  </footer>

  <script>
    // Inject today's date into the header
    const dateEl = document.getElementById('today-date')
    dateEl.textContent = new Date().toLocaleDateString('en-MY', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
    })

    // Checklist interactivity
    const checkboxes = document.querySelectorAll('.checklist-checkbox')
    const counter    = document.getElementById('checklist-counter')
    const bar        = document.getElementById('progress-bar')
    const total      = checkboxes.length

    function updateProgress() {
      const done = [...checkboxes].filter(cb => cb.checked).length
      const pct  = Math.round((done / total) * 100)
      counter.textContent = `${done} of ${total} completed`
      bar.style.width = pct + '%'

      // Toggle done class on parent <li>
      checkboxes.forEach(cb => {
        cb.closest('.checklist-item').classList.toggle('done', cb.checked)
      })
    }

    checkboxes.forEach(cb => cb.addEventListener('change', updateProgress))
  </script>

</body>
</html>
